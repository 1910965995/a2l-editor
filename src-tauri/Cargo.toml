[package]
name = "a2l-editor"
version = "1.0.0"
description = "A2L Editor - ASAM MCD-2 MC file editor and generator"
authors = ["A2L Tool"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "a2l_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
roxmltree = "0.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
